version: '3.8'

services: 
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: payment-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      #configurar apos criar banco
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=payment_db;Username=postgres;Password=adminpassword
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword   #configurar apos criar banco
      POSTGRES_DB: payment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data: